[project]
name = "servey"
version = "0.0.0"  # This will be replaced by the release workflow
description = "A better API layer for python"
authors = [
    {name = "Tim O'Farrell", email = "tofarr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography~=37.0",
    "injecty~=0.0",
    "json-urley~=1.0",
    "marshy~=5.0",
    "pyjwt~=2.4",
    "python-dateutil~=2.8",
    "schemey~=7.0",
]

[project.urls]
Repository = "https://github.com/tofarr/servey"

[project.optional-dependencies]
dev = [
    "black~=23.3",
    "boto3~=1.26",
    "pytest~=7.2",
    "pytest-cov~=4.0",
    "pytest-xdist~=3.2",
    "pylint~=3.0",
]
server = [
    "starlette~=0.19",
    "strawberry-graphql~=0.151",
    "uvicorn[standard]~=0.18",
    "pygments~=2.13",
    "requests~=2.28",
    "python-multipart~=0.0",
]
scheduler = [
    "celery~=5.2",
]
serverless = [
    "pyyaml~=6.0",
    "ruamel.yaml~=0.17",
    "strawberry-graphql~=0.177",
]
web_page = [
    "Jinja2~=3.1",
]
all = [
    "black~=23.3",
    "boto3~=1.26",
    "pytest~=7.2",
    "pytest-cov~=4.0",
    "pytest-xdist~=3.2",
    "pylint~=3.0",
    "starlette~=0.19",
    "strawberry-graphql~=0.151",
    "uvicorn[standard]~=0.18",
    "pygments~=2.13",
    "requests~=2.28",
    "python-multipart~=0.0",
    "celery~=5.2",
    "pyyaml~=6.0",
    "ruamel.yaml~=0.17",
    "strawberry-graphql~=0.177",
    "Jinja2~=3.1",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servey"]

[tool.hatch.build.targets.sdist]
exclude = ["tests*", "servey_main*", "static_site", "examples"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[dependency-groups]
dev = [
    "hatch-vcs>=0.5.0",
    "hatchling>=1.28.0",
]